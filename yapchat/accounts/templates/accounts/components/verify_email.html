{% load static %}

<div id="verify-email-state" class="auth-state">
    <p>Check your email</p>
    <div id="verify-email-address" class="verify-email-address">
        email@example.com
    </div>

    <p id="verify-email-help" class="verify-email-help" aria-live="polite">
        We sent a verification link to that address. Open the link in your inbox to finish creating your account.
    </p>

    <div class="verify-email-actions">
        <button id="back-to-registration-button" type="button">Back</button>
    </div>
</div>
