<!-- chat/templates/chat/room.html -->
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>Chat Room</title>
    <link rel="stylesheet" href="https://unpkg.com/7.css">
    <link rel="stylesheet" href="{% static 'css/room.css' %}?v=1">
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

</head>
<body>
    <div class="container">
        <div class="video-container">
            <div class="video-wrapper">

                <div class="glass window active" style="max-width: 300px">
                    <div class="title-bar">
                        <div class="title-bar-text">You</div>
                        <div class="title-bar-controls">
                        <button aria-label="Minimize"></button>
                        <button aria-label="Maximize"></button>
                        <button aria-label="Close"></button>
                        </div>
                    </div>
                    <div class="window-body">
                        <!-- We cannot use display:none or the browser stops processing the camera feed -->
                        <video id="local-video" autoplay playsinline muted style="position: absolute; opacity: 0; pointer-events: none;"></video>
                        <canvas id="local-canvas" width="640" height="480" style="width: 100%; height: auto;"></canvas>
                    </div>
                </div>  

            </div>

        </div>
             <div class="video-wrapper">

                <div class="glass window active" style="max-width: 300px">
                    <div class="title-bar">
                        <div id="remote-username-display" class="title-bar-text">Stranger</div>
                        <div class="title-bar-controls">
                        <button aria-label="Minimize"></button>
                        <button aria-label="Maximize"></button>
                        <button aria-label="Close" id="remote-video-close-button"></button>
                        </div>
                    </div>
                    <div class="window-body">
                        <video id="remote-video" autoplay playsinline></video>
                    </div>
                </div> 

            </div>           
    </div>
    <div class="window glass active" style="max-width: 300px">
        <div class="title-bar">
            <div class="title-bar-text">Chat</div>
            <div class="title-bar-controls">
            <button aria-label="Minimize"></button>
            <button aria-label="Maximize"></button>
            <button aria-label="Close"></button>
        </div>
    </div>
    <div class="window-body has-space">
        <!-- CHAT LOG -->
        <textarea id="chat-log"></textarea><div id="typing-indicator" style="display: none; color: gray; font-style: italic;"></div><br/>
                    
        <div class="input-area">
            <input id="chat-message-input" type="text"/><br/>
            <input id="chat-message-submit" type="button" value="Send"/>
            {{ room_name|json_script:"room-name" }}
        </div>

    </div>

    <script type="module" src="{% static 'js/main.js' %}?v=5"></script>
    <script type="module" src="{% static 'js/features/typingIndicator.js' %}?v=5"></script>
</body>
</html>
