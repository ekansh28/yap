{% load static %}
<!-- chat/templates/chat/index.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="https://unpkg.com/98.css">

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'js/Components/Notification/Notification.css' %}">
     <link rel="stylesheet" href="{% static 'accounts/css/auth_modal.css' %}">
     <link rel="stylesheet" href="{% static 'accounts/css/verify_email.css' %}?v=2">
    <title>Chat Rooms</title>
</head>
{% load django_browser_reload %}
{% django_browser_reload_script %}
<body>

    <div id="top-bar">
        <div class="title-bar-text"></div>

        <button id= "auth-button" class="auth-button"> Login/Signup</button>
         {% include "accounts/components/auth_modal.html" %}
    </div>
     
     <div class="window" style="width: 300px">
       <div class="title-bar">
        
            
       </div>
      <div class="window-body has-space">
      
        <p>enter tags (comma-separated)</p>
        <div id="tags-container">
          <input
              id="tags-input"
              type="text"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="off"
              spellcheck="false"
              placeholder="music, gaming, tech"
          >

        </div>


       <div id="ButtonContainer">
        <button id="text-chat-button">Text Chat</button>
        <button id="video-chat-button">Video Chat</button>
        </div>


      </div>
    </div>

    <script type="module" src="{% static 'js/LandingPage/main.js' %}"></script>
    <script src="{% static 'accounts/js/auth_modal.js' %}"></script>


</body>
</html>
