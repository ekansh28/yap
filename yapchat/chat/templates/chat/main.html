{% load static %}
<!-- chat/templates/chat/index.html -->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <link rel="stylesheet" href="https://unpkg.com/98.css">

    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'js/Components/Notification/Notification.css' %}">
    <title>Chat Rooms</title>
</head>
{% load django_browser_reload %}
{% django_browser_reload_script %}
<body>
     <div class="window" style="width: 300px">
       <div class="title-bar">
         <div class="title-bar-text">hi ballscord</div>
         <div class="title-bar-controls">
           <button aria-label="Minimize"></button>
           <button aria-label="Maximize"></button>
           <button aria-label="Close"></button>
         </div>
       </div>
      <div class="window-body has-space">
      
        <p>enter tags (comma-separated)</p>
        <div id="tags-container">
        <input
            id="tags-input"
            type="text"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="music, gaming, tech">
    </div>
       
        <button>Text Chat</button>
        <button>Video Chat</button>
      </div>
    </div>

    <script type="module" src="{% static 'js/LandingPage/main.js' %}"></script>
    <script>
        document.querySelector('#user-name-input').focus();
        document.querySelector('#user-name-input').onkeyup = function(e) {
            if (e.key === 'Enter') {  // enter, return
                document.querySelector('#user-name-submit').click();
            }
        };

        document.querySelector('#user-name-submit').onclick = function(e) {
            var userNameInput = document.querySelector('#user-name-input');
            var userName = userNameInput.value.trim();
            console.log("Capturing username:", userName);

            if (!userName) {
                alert("Please enter a username");
                return;
            }
            
            // 1. Save the username to LocalStorage so we can use it in the chat room
            localStorage.setItem('chat_username', userName);

            // Asking Backend for Room Assignment
            window.location.href = '/chat/join-lobby/'

        
        };
    </script>


</body>
</html>
